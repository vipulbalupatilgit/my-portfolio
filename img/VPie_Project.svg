    <circle cx="220" cy="210.00000000000003" r="4"/>
    <circle cx="580" cy="615.0" r="4"/>
  </g>

  <!-- corner bracket accents -->
  <g stroke="#ff2e9a" stroke-width="2.5" fill="none" opacity="0.8">
    <path d="M60,60 L60,110 M60,60 L110,60"/>
    <path d="M1140,690 L1140,640 M1140,690 L1090,690"/>
