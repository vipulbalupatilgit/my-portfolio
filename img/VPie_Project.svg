  <circle cx="150" cy="120" r="260" fill="url(#glow1)"/>
  <circle cx="1040" cy="610" r="300" fill="url(#glow2)"/>

  <!-- circuit lines -->
  <g stroke="#ff2e9a" stroke-opacity="0.35" stroke-width="1.5" fill="none">
